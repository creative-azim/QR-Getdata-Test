<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Heaven Plaza Vehicle Record</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: Calibri, 'Segoe UI', Roboto, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 14px 12px;
      background-color: #f4f6f9;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 410px;
      background: #ffffff;
      padding: 20px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }

    /* --- HEADER & DEVELOPER CREDIT --- */
    .header-box {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eaeaea;
    }
    .header-box h2 {
      margin: 0;
      color: #111;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: 0.3px;
    }
    .header-box .dev-credit {
      margin: 6px 0 0 0;
      font-size: 15.5px; /* Larger and clearer, yet smaller than the 22px main heading */
      color: #444;
      font-weight: 600;
      line-height: 1.4;
    }

    /* --- SPACIOUS & CLEAN LOGIN SCREEN --- */
    #loginSection {
      display: block;
      margin-top: 18px;
      padding: 4px 2px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: #222;
      font-size: 15.5px;
      line-height: 1.4;
    }
    .form-group input {
      width: 100%;
      padding: 13px 12px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 8px;
      line-height: 1.4;
    }
    .btn-login {
      width: 100%;
      padding: 13px;
      font-size: 17px;
      font-weight: bold;
      background-color: #0066cc;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      line-height: 1.4;
    }
    .btn-login:disabled {
      background-color: #88b4e0;
      cursor: not-allowed;
    }

    /* --- APP HEADER & STATUS BAR --- */
    #appSection {
      display: none;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      line-height: 1.4;
      color: #333;
      margin-bottom: 14px;
      padding: 8px 12px;
      background: #eef2f6;
      border-radius: 8px;
    }
    .top-actions {
      display: flex;
      gap: 8px;
    }
    .small-btn {
      background: #fff;
      border: 1px solid #0066cc;
      color: #0066cc;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 12.5px;
      cursor: pointer;
      font-weight: 600;
    }
    .logout-btn {
      border-color: #c81e1e;
      color: #c81e1e;
    }

    /* --- QR SCANNER & SEARCH --- */
    #reader {
      width: 100%;
      margin: 4px 0 14px 0;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #333;
      background: #000;
    }
    .manual-box {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .manual-box input {
      flex: 1;
      padding: 11px 12px;
      font-size: 15.5px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .manual-box button {
      padding: 11px 18px;
      font-size: 15.5px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* --- COMPACT SINGLE-SCREEN TABLE (Kept Exact as Requested) --- */
    #resultSection {
      display: none;
      margin-top: 6px;
    }
    .details-table {
      width: 100%;
      border-collapse: collapse;
      border: 2px solid #000;
      background: #fff;
    }
    .details-table th,
    .details-table td {
      border: 1px solid #000;
      padding: 5px 10px; /* Kept untouched so all 13 rows fit on one screen */
      font-size: 15px;
      line-height: 1.15;
      color: #000;
    }
    .details-table th {
      background-color: #fce4d6;
      text-align: left;
      font-weight: 700;
      width: 52%;
    }
    .details-table td {
      background-color: #ffffff;
      text-align: center;
      font-weight: 500;
      width: 48%;
    }

    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 11px;
      background: #fde8e8;
      border: 1px solid #f8b4b4;
      color: #c81e1e;
      text-align: center;
      font-weight: bold;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
    .btn-scan-again {
      width: 100%;
      margin-top: 12px;
      padding: 11px;
      font-size: 16px;
      font-weight: bold;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Persistent Header (Shown on both Login & Main App) -->
  <div class="header-box">
    <h2>Heaven Plaza Vehicle Record</h2>
    <p class="dev-credit">(Developed by : Azim Bhayani)</p>
  </div>

  <!-- ================= 1. LOGIN SCREEN ================= -->
  <div id="loginSection">
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="userIdInput">User ID</label>
        <input type="text" id="userIdInput" placeholder="Enter User ID" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="Enter Password" required autocomplete="current-password" />
      </div>
      <button type="submit" id="loginBtn" class="btn-login">Login & Load Data</button>
    </form>
    <div id="loginError" class="error-msg"></div>
  </div>

  <!-- ================= 2. MAIN SCANNER APP ================= -->
  <div id="appSection">
    <div class="top-bar">
      <span id="dbStatus">Ready</span>
      <div class="top-actions">
        <button class="small-btn" onclick="syncDatabase()">Sync</button>
        <button class="small-btn logout-btn" onclick="handleLogout()">Logout</button>
      </div>
    </div>

    <!-- Scanner Viewport -->
    <div id="scannerSection">
      <div id="reader"></div>
      <div class="manual-box">
        <input type="text" id="manualInput" placeholder="Or enter Sticker No. (e.g. 1002)" />
        <button onclick="handleManualSearch()">Search</button>
      </div>
    </div>

    <!-- Error Message -->
    <div id="errorBox" class="error-msg"></div>

    <!-- Result Table (Matches Display.jpg) -->
    <div id="resultSection">
      <table class="details-table" id="vehicleTable">
        <tbody></tbody>
      </table>
      <button class="btn-scan-again" onclick="startScanner()">Scan Next Vehicle</button>
    </div>
  </div>
</div>

<script>
  // =========================================================================
  // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW:
  // =========================================================================
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRX5IYn-lAafoGPePBgUtc3ae9zTSrbK3MsZje7pGQI9Glj1JQcJOcBVc1PxFvXtZ6Yg/exec";

  const FIELDS = [
    "Sticker No.",
    "Wing",
    "Flat No.",
    "No. of Vehicle",
    "Type",
    "Owner/Rent",
    "Vehicle Type",
    "Vehicle Number",
    "Vehicle Number-2",
    "Vehicle Brand",
    "Model",
    "Colour",
    "Comment"
  ];

  let vehicleDB = {};
  let html5QrCode = null;
  let isScanning = false;

  // Sound + vibration feedback on QR scan
  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(100);
  }

  // Handle Login Form Submission
  async function handleLogin(e) {
    e.preventDefault();
    const userId = document.getElementById("userIdInput").value.trim();
    const password = document.getElementById("passwordInput").value.trim();
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");

    loginError.style.display = "none";
    loginBtn.disabled = true;
    loginBtn.textContent = "Verifying...";

    try {
      const url = `${GOOGLE_SCRIPT_URL}?userId=${encodeURIComponent(userId)}&password=${encodeURIComponent(password)}`;
      const response = await fetch(url);
      const json = await response.json();

      if (json.status === "success") {
        vehicleDB = json.records;
        sessionStorage.setItem("auth_user", userId);
        sessionStorage.setItem("auth_pass", password);
        localStorage.setItem("vehicleDB_cache", JSON.stringify(vehicleDB));

        showScannerApp(userId, Object.keys(vehicleDB).length);
      } else {
        loginError.textContent = json.message || "Invalid User ID or Password.";
        loginError.style.display = "block";
      }
    } catch (err) {
      loginError.textContent = "Connection error. Please check your internet or Script URL.";
      loginError.style.display = "block";
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Login & Load Data";
    }
  }

  // Unlock App UI and start camera
  function showScannerApp(user, count) {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("appSection").style.display = "block";
    document.getElementById("dbStatus").textContent = `${user} (${count} stickers)`;
    startScanner();
  }

  // Re-sync data while logged in
  async function syncDatabase() {
    const userId = sessionStorage.getItem("auth_user");
    const password = sessionStorage.getItem("auth_pass");
    const statusEl = document.getElementById("dbStatus");

    if (!userId || !password) {
      handleLogout();
      return;
    }

    statusEl.textContent = "Syncing...";
    try {
      const url = `${GOOGLE_SCRIPT_URL}?userId=${encodeURIComponent(userId)}&password=${encodeURIComponent(password)}`;
      const response = await fetch(url);
      const json = await response.json();

      if (json.status === "success") {
        vehicleDB = json.records;
        localStorage.setItem("vehicleDB_cache", JSON.stringify(vehicleDB));
        statusEl.textContent = `${userId} (${Object.keys(vehicleDB).length} stickers)`;
      } else {
        alert("Session expired or password changed. Please login again.");
        handleLogout();
      }
    } catch (err) {
      statusEl.textContent = `${userId} (Offline cache)`;
    }
  }

  // Logout & wipe local data
  function handleLogout() {
    sessionStorage.clear();
    localStorage.removeItem("vehicleDB_cache");
    vehicleDB = {};

    if (html5QrCode && isScanning) {
      html5QrCode.stop().catch(() => {});
      isScanning = false;
    }

    document.getElementById("userIdInput").value = "";
    document.getElementById("passwordInput").value = "";
    document.getElementById("appSection").style.display = "none";
    document.getElementById("loginSection").style.display = "block";
  }

  // Start Mobile Rear Camera with aspectRatio: 1.0
  function startScanner() {
    document.getElementById("resultSection").style.display = "none";
    document.getElementById("errorBox").style.display = "none";
    document.getElementById("scannerSection").style.display = "block";
    document.getElementById("manualInput").value = "";

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    if (isScanning) return;

    html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 210, height: 210 },
        aspectRatio: 1.0
      },
      (decodedText) => {
        playBeep();
        stopScannerAndShowResult(decodedText.trim());
      },
      (errorMessage) => {}
    ).then(() => {
      isScanning = true;
    }).catch((err) => {
      console.warn("Camera error:", err);
    });
  }

  function stopScannerAndShowResult(scannedText) {
    if (html5QrCode && isScanning) {
      html5QrCode.stop().then(() => {
        isScanning = false;
        displayStickerDetails(scannedText);
      }).catch(() => {
        isScanning = false;
        displayStickerDetails(scannedText);
      });
    } else {
      displayStickerDetails(scannedText);
    }
  }

  function handleManualSearch() {
    const val = document.getElementById("manualInput").value.trim();
    if (val) {
      stopScannerAndShowResult(val);
    }
  }

  function displayStickerDetails(rawScan) {
    const errorBox = document.getElementById("errorBox");
    errorBox.style.display = "none";

    let record = vehicleDB[rawScan];
    if (!record) {
      const match = rawScan.match(/\b(\d{4,})\b/);
      if (match && vehicleDB[match[1]]) {
        record = vehicleDB[match[1]];
      }
    }

    if (!record) {
      errorBox.textContent = `No record found for Sticker: "${rawScan}"`;
      errorBox.style.display = "block";
      document.getElementById("scannerSection").style.display = "block";
      startScanner();
      return;
    }

    const tbody = document.querySelector("#vehicleTable tbody");
    tbody.innerHTML = "";

    FIELDS.forEach((field) => {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      th.textContent = field;

      const td = document.createElement("td");
      td.textContent = record[field] !== undefined && record[field] !== null ? record[field] : "";

      tr.appendChild(th);
      tr.appendChild(td);
      tbody.appendChild(tr);
    });

    document.getElementById("scannerSection").style.display = "none";
    document.getElementById("resultSection").style.display = "block";
  }

  // Restore session if user refreshes page while already logged in
  window.addEventListener("DOMContentLoaded", () => {
    const savedUser = sessionStorage.getItem("auth_user");
    const cachedDB = localStorage.getItem("vehicleDB_cache");

    if (savedUser && cachedDB) {
      vehicleDB = JSON.parse(cachedDB);
      showScannerApp(savedUser, Object.keys(vehicleDB).length);
      syncDatabase();
    }
  });
</script>

</body>
</html>
